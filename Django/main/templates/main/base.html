<!DOCTYPE html>
<html lang="ru">
<head>

    <title>{% block title %}{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'main/style.css' %}">

    <header class="mb-auto"> 
    <div class="header-container"> 
        <nav class="nav nav-masthead"> 
            <a class="nav-link fw-bold py-1 px-0 active" href="{% url 'home' %}">Главная страница</a> 
            <a class="nav-link fw-bold py-1 px-0" href="{% url 'forecast' %}">Прогноз</a>
            <a class="nav-link fw-bold py-1 px-0" href="{% url 'analise' %}">Статистика</a>
            <a class="nav-link fw-bold py-1 px-0" href="{% url 'history' %}">История прогнозов</a>
        </nav>

        <div class="user-panel">
            
            <span class="user-name">Привет, <strong>{{ user.username }}!</strong></span>
            <form action="{% url 'login' %}" method="post">
                {% csrf_token %}
                <button type="submit" class="logout-btn">Выйти</button>
            
            </form>
        </div>
    </div> 
</header>
</head>
<body>
    {% if user.is_authenticated %}
    {% block content %}
    {% endblock %}
</body>
{% endif %}
</html>
