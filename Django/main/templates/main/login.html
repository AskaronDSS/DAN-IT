<!DOCTYPE html>
<html lang="ru">
<head>
    <title>Вход в систему</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'main/style.css' %}">
</head>
<body>
    <div class="auth-container">
        <div class="content-box auth-box">
            <h1>Авторизация</h1>
            
            <form method="post" class="industrial-form">
                {% csrf_token %}
                
                {% for field in form %}
                    <div class="form-group">
                        {{ field.label_tag }}
                        {{ field }}
                        {% if field.errors %}
                            <div class="error" style="color: #ff4444; font-size: 0.8rem;">
                                {{ field.errors }}
                            </div>
                        {% endif %}
                    </div>
                {% endfor %}

                <button type="submit" class="cta-button">Войти в терминал</button>
            </form>
            
            <p class="auth-footer">
                Нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a>
            </p>
        </div>
    </div>
</body>
</html>
